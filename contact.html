<!DOCTYPE html>

<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Elar Baskı Beton Kalıpları</title>
  <meta name="description" content="Elar Baskı Beton Kalıpları ve profesyonel logo hizmetleri.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background: #f4f7f6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* Kartın genişliğini tek sütuna göre ayarladık */
  .contact-container {
    background: #1e293b;
    /* Arka planı tamamen koyu yaptık */
    width: 100%;
    max-width: 450px;
    /* Tek blok için genişliği ideal bir boyuta çektik */
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    overflow: hidden;
  }

  /* İletişim Bilgileri Alanı */
  .contact-info {
    color: #ffffff;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 35px;
    /* İçerikler arası boşlukları dengeli hale getirdik */
  }

  .info-header h2 {
    font-size: 28px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .info-header p {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.5;
  }

  .info-details {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .info-item {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .info-item i {
    font-size: 20px;
    color: #38bdf8;
    width: 30px;
    text-align: center;
  }

  .info-item span {
    font-size: 15px;
    color: #cbd5e1;
  }

  .social-links {
    display: flex;
    gap: 15px;
    margin-top: 10px;
  }

  .social-links a {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.1);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .social-links a:hover {
    background: #38bdf8;
    transform: translateY(-3px);
  }
</style>

<!-- FontAwesome İkon Kütüphanesi -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>
  <div class="contact-container">
    <!-- Sadece İletişim Bilgilerinin Kaldığı Blok -->
    <div class="contact-info">
      <div class="info-header">
        <h2>Bizimle İletişime Geçin</h2>
        <p>Sorularınız, önerileriniz veya iş birlikleri için doğrudan bize ulaşabilirsiniz.</p>
      </div>

      <div class="info-details">
        <div class="info-item">
          <i class="fas fa-phone-alt"></i>
          <span>+90 0530 774 9498</span>
        </div>
        <div class="info-item">
          <i class="fas fa-envelope"></i>
          <span>elaryapi@gmail.com</span>
        </div>
        <div class="info-item">
          <i class="fas fa-map-marker-alt"></i>
          <span>İstanbul, Türkiye</span>
        </div>
      </div>

      <div class="social-links">
        <a href="#" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
        <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="#" target="_blank"><i class="fab fa-linkedin-in"></i></a>
      </div>
    </div>
  </div>
</body>
